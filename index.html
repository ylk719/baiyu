<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ins 韩系软萌</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 页面容器 -->
  <div class="page-wrapper" id="pageWrapper">
    <!-- 星空背景（手机页面内） -->
    <canvas id="starsCanvas"></canvas>

    <!-- ========== 第一页 ========== -->
    <div class="page page-1 active" id="page1">
      <div class="page-content">
        <!-- 顶部两组单选条目 -->
        <div class="top-selectors">
          <div class="selector-row">
            <div class="selector-avatar avatar-pink" data-upload="avatar" data-key="p1-avatar1">
              <svg viewBox="0 0 40 40"><circle cx="20" cy="15" r="7" fill="#fff" opacity="0.9"/><ellipse cx="20" cy="32" rx="12" ry="8" fill="#fff" opacity="0.9"/></svg>
            </div>
            <div class="selector-input-box">
              <span class="selector-label" contenteditable="true" data-key="p1-label1">我的日常</span>
            </div>
          </div>
          <div class="selector-row">
            <div class="selector-avatar avatar-blue" data-upload="avatar" data-key="p1-avatar2">
              <svg viewBox="0 0 40 40"><circle cx="20" cy="15" r="7" fill="#fff" opacity="0.9"/><ellipse cx="20" cy="32" rx="12" ry="8" fill="#fff" opacity="0.9"/></svg>
            </div>
            <div class="selector-input-box">
              <span class="selector-label" contenteditable="true" data-key="p1-label2">好友动态</span>
            </div>
          </div>
        </div>

        <!-- 4×2 应用图标网格 -->
        <div class="app-grid">
          <div class="app-item">
            <div class="app-icon icon-dot-pink">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">日历</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-blue">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">相册</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-mint">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">音乐</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-lavender">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">天气</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-peach">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">备忘录</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-sky">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">时钟</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-rose">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">相机</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-lilac">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">地图</span>
          </div>
        </div>

        <!-- PhotoBook 相册小组件 -->
        <div class="photobook-card">
          <div class="photobook-header">
            <div class="photobook-title">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8a9a" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="8" cy="16" r="1.5" fill="#8a8a9a"/></svg>
              <span contenteditable="true" data-key="p1-pb-title">PhotoBook</span>
            </div>
            <div class="photobook-actions">
              <span class="photobook-date" contenteditable="true" data-key="p1-pb-date">7月27日</span>
              <button class="heart-btn" id="heartBtn1">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="none" stroke="#d0a0b0" stroke-width="1.5"/></svg>
              </button>
            </div>
          </div>
          <div class="photobook-preview">
            <div class="preview-img" data-upload="photo" data-key="p1-photo1" style="background-image: linear-gradient(160deg, #fce4ec 0%, #f8d0dc 30%, #f0c0d0 60%, #e8b8d0 100%)"></div>
            <div class="preview-img" data-upload="photo" data-key="p1-photo2" style="background-image: linear-gradient(160deg, #e3f0fc 0%, #d0e4f8 30%, #c8dcf0 60%, #bcd4ec 100%)"></div>
            <div class="preview-img" data-upload="photo" data-key="p1-photo3" style="background-image: linear-gradient(160deg, #e8f4ec 0%, #d0e8d8 30%, #c8e0d0 60%, #bcd8c8 100%)"></div>
          </div>
        </div>
      </div>

      <!-- 底部 Dock 栏 -->
      <div class="dock-bar">
        <div class="dock-item active">
          <div class="dock-icon dock-icon-home"></div>
          <span>主页</span>
        </div>
        <div class="dock-item">
          <div class="dock-icon dock-icon-discover"></div>
          <span>发现</span>
        </div>
        <div class="dock-item">
          <div class="dock-icon dock-icon-post"></div>
          <span>发布</span>
        </div>
        <div class="dock-item">
          <div class="dock-icon dock-icon-profile"></div>
          <span>设置</span>
        </div>
      </div>
    </div>

    <!-- ========== 第二页 ========== -->
    <div class="page page-2" id="page2">
      <div class="page-content">
        <!-- 顶部两组单选条目 -->
        <div class="top-selectors">
          <div class="selector-row">
            <div class="selector-avatar avatar-mint" data-upload="avatar" data-key="p2-avatar1">
              <svg viewBox="0 0 40 40"><circle cx="20" cy="15" r="7" fill="#fff" opacity="0.9"/><ellipse cx="20" cy="32" rx="12" ry="8" fill="#fff" opacity="0.9"/></svg>
            </div>
            <div class="selector-input-box">
              <span class="selector-label" contenteditable="true" data-key="p2-label1">推荐关注</span>
            </div>
          </div>
          <div class="selector-row">
            <div class="selector-avatar avatar-peach" data-upload="avatar" data-key="p2-avatar2">
              <svg viewBox="0 0 40 40"><circle cx="20" cy="15" r="7" fill="#fff" opacity="0.9"/><ellipse cx="20" cy="32" rx="12" ry="8" fill="#fff" opacity="0.9"/></svg>
            </div>
            <div class="selector-input-box">
              <span class="selector-label" contenteditable="true" data-key="p2-label2">旅行日记</span>
            </div>
          </div>
        </div>

        <!-- 4×2 应用图标网格 -->
        <div class="app-grid">
          <div class="app-item">
            <div class="app-icon icon-dot-coral">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">笔记</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-teal">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">健身</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-apricot">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">阅读</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-periwinkle">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">闹钟</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-blush">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">提醒</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-aqua">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">设置</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-butter">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">邮件</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-mauve">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">浏览器</span>
          </div>
        </div>

        <!-- PhotoBook 相册小组件 -->
        <div class="photobook-card">
          <div class="photobook-header">
            <div class="photobook-title">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8a9a" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="8" cy="16" r="1.5" fill="#8a8a9a"/></svg>
              <span contenteditable="true" data-key="p2-pb-title">PhotoBook</span>
            </div>
            <div class="photobook-actions">
              <span class="photobook-date" contenteditable="true" data-key="p2-pb-date">7月25日</span>
              <button class="heart-btn" id="heartBtn2">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="none" stroke="#d0a0b0" stroke-width="1.5"/></svg>
              </button>
            </div>
          </div>
          <div class="photobook-preview">
            <div class="preview-img" data-upload="photo" data-key="p2-photo1" style="background-image: linear-gradient(160deg, #fef4e8 0%, #fce8d0 30%, #f8dcc0 60%, #f0d0b8 100%)"></div>
            <div class="preview-img" data-upload="photo" data-key="p2-photo2" style="background-image: linear-gradient(160deg, #ede8f8 0%, #dcd0f0 30%, #d0c4e8 60%, #c4b8e0 100%)"></div>
            <div class="preview-img" data-upload="photo" data-key="p2-photo3" style="background-image: linear-gradient(160deg, #e0f4f0 0%, #c8e8e0 30%, #bcdcd4 60%, #b0d0c8 100%)"></div>
          </div>
        </div>
      </div>

      <!-- 底部 Dock 栏 -->
      <div class="dock-bar">
        <div class="dock-item">
          <div class="dock-icon dock-icon-home"></div>
          <span>主页</span>
        </div>
        <div class="dock-item active">
          <div class="dock-icon dock-icon-discover"></div>
          <span>发现</span>
        </div>
        <div class="dock-item">
          <div class="dock-icon dock-icon-post"></div>
          <span>发布</span>
        </div>
        <div class="dock-item">
          <div class="dock-icon dock-icon-profile"></div>
          <span>设置</span>
        </div>
      </div>
    </div>
    <!-- ========== 第三页：设置 ========== -->
    <div class="page page-3" id="page3">
      <div class="page-content settings-content">
        <!-- 设置页头部 -->
        <div class="settings-header">
          <button class="settings-back" id="settingsBack">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a8a9a" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <span class="settings-title">设置</span>
          <div style="width:36px"></div>
        </div>

        <!-- 背景预览 -->
        <div class="bg-preview-card">
          <div class="bg-preview-label">背景预览</div>
          <div class="bg-preview-frame" id="bgPreviewFrame">
            <div class="bg-preview-stars">✦ ✧ ⋆ ✦ ✧ ⋆ ✦ ✧ ⋆</div>
          </div>
        </div>

        <!-- 预设背景 -->
        <div class="settings-section">
          <div class="settings-section-title">预设背景</div>
          <div class="preset-bg-grid">
            <div class="preset-bg-item" data-bg="default" style="background: linear-gradient(180deg, #e8f4fd 0%, #d4eafc 35%, #c5e0f5 70%, #beddf5 100%)"></div>
            <div class="preset-bg-item" data-bg="pink" style="background: linear-gradient(180deg, #fce4ec 0%, #f8d0dc 35%, #f0c0d0 70%, #e8b8c8 100%)"></div>
            <div class="preset-bg-item" data-bg="lavender" style="background: linear-gradient(180deg, #f0e8f8 0%, #e0d0f0 35%, #d0c0e8 70%, #c4b4e0 100%)"></div>
            <div class="preset-bg-item" data-bg="mint" style="background: linear-gradient(180deg, #e8f8f0 0%, #d0f0e0 35%, #c0e8d4 70%, #b4dcc8 100%)"></div>
            <div class="preset-bg-item" data-bg="peach" style="background: linear-gradient(180deg, #fef4e8 0%, #fce8d0 35%, #f8dcc0 70%, #f0d0b8 100%)"></div>
            <div class="preset-bg-item" data-bg="sky" style="background: linear-gradient(180deg, #e0f0fc 0%, #c8e4f8 35%, #b8d8f4 70%, #a8cce8 100%)"></div>
            <div class="preset-bg-item" data-bg="warm" style="background: linear-gradient(180deg, #fef8f0 0%, #fcf0e0 35%, #f8e8d0 70%, #f0dcc0 100%)"></div>
            <div class="preset-bg-item" data-bg="lilac" style="background: linear-gradient(180deg, #f4f0f8 0%, #e8e0f4 35%, #dcd0ec 70%, #d0c4e4 100%)"></div>
          </div>
        </div>

        <!-- 自定义上传 -->
        <div class="settings-section">
          <div class="settings-section-title">自定义背景</div>
          <button class="upload-bg-btn" id="uploadBgBtn">
            <div class="upload-bg-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
            <span>从相册上传背景图</span>
          </button>
          <button class="reset-bg-btn" id="resetBgBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a8b4" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 10 9 10"/></svg>
            <span>恢复默认</span>
          </button>
        </div>

        <!-- 保存提示 -->
        <div class="save-hint">✓ 修改后自动保存</div>
      </div>

      <!-- 底部 Dock 栏 -->
      <div class="dock-bar">
        <div class="dock-item">
          <div class="dock-icon dock-icon-home"></div>
          <span>主页</span>
        </div>
        <div class="dock-item">
          <div class="dock-icon dock-icon-discover"></div>
          <span>发现</span>
        </div>
        <div class="dock-item">
          <div class="dock-icon dock-icon-post"></div>
          <span>发布</span>
        </div>
        <div class="dock-item active">
          <div class="dock-icon dock-icon-profile"></div>
          <span>设置</span>
        </div>
      </div>
    </div>
    <!-- 页面指示器 -->
    <div class="page-indicator" id="pageIndicator">
      <span class="dot active" data-page="0"></span>
      <span class="dot" data-page="1"></span>
      <span class="dot" data-page="2"></span>
    </div>
  </div>

  <!-- 隐藏的文件上传输入 -->
  <input type="file" id="fileInput" accept="image/*" style="display:none">
  <input type="file" id="bgFileInput" accept="image/*" style="display:none">

  <script src="script.js"></script>
</body>
</html>
