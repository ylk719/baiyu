<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ins 韩系软萌</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 星空背景 -->
  <canvas id="starsCanvas"></canvas>

  <!-- 顶部渐变虚化 -->
  <div class="blur-overlay blur-top"></div>
  <!-- 底部渐变虚化 -->
  <div class="blur-overlay blur-bottom"></div>

  <!-- 页面容器 -->
  <div class="page-wrapper" id="pageWrapper">
    <!-- ========== 第一页 ========== -->
    <div class="page page-1 active" id="page1">
      <div class="page-content">
        <!-- 顶部两组单选条目 -->
        <div class="top-selectors">
          <div class="selector-pill active">
            <div class="selector-avatar avatar-pink">
              <svg viewBox="0 0 40 40"><circle cx="20" cy="15" r="7" fill="#fff" opacity="0.9"/><ellipse cx="20" cy="32" rx="12" ry="8" fill="#fff" opacity="0.9"/></svg>
            </div>
            <span class="selector-label">我的日常</span>
          </div>
          <div class="selector-pill">
            <div class="selector-avatar avatar-blue">
              <svg viewBox="0 0 40 40"><circle cx="20" cy="15" r="7" fill="#fff" opacity="0.9"/><ellipse cx="20" cy="32" rx="12" ry="8" fill="#fff" opacity="0.9"/></svg>
            </div>
            <span class="selector-label">好友动态</span>
          </div>
        </div>

        <!-- 4×2 应用图标网格 -->
        <div class="app-grid">
          <div class="app-item">
            <div class="app-icon icon-dot-pink">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">日历</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-blue">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">相册</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-mint">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">音乐</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-lavender">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">天气</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-peach">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">备忘录</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-sky">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">时钟</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-rose">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">相机</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-lilac">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">地图</span>
          </div>
        </div>

        <!-- PhotoBook 相册小组件 -->
        <div class="photobook-card">
          <div class="photobook-header">
            <div class="photobook-title">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8a9a" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="8" cy="16" r="1.5" fill="#8a8a9a"/></svg>
              <span>PhotoBook</span>
            </div>
            <div class="photobook-actions">
              <span class="photobook-date">7月27日</span>
              <button class="heart-btn" id="heartBtn1">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="none" stroke="#d0a0b0" stroke-width="1.5"/></svg>
              </button>
            </div>
          </div>
          <div class="photobook-preview">
            <div class="preview-img img-1"></div>
            <div class="preview-img img-2"></div>
            <div class="preview-img img-3"></div>
          </div>
        </div>

        <!-- 搜索框 -->
        <div class="search-bar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b0b0b8" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <span class="search-placeholder">搜索</span>
        </div>
      </div>

      <!-- 底部 Dock 栏 -->
      <div class="dock-bar">
        <div class="dock-item active">
          <div class="dock-icon dock-icon-home"></div>
          <span>主页</span>
        </div>
        <div class="dock-item">
          <div class="dock-icon dock-icon-discover"></div>
          <span>发现</span>
        </div>
        <div class="dock-item">
          <div class="dock-icon dock-icon-post"></div>
          <span>发布</span>
        </div>
        <div class="dock-item">
          <div class="dock-icon dock-icon-profile"></div>
          <span>我的</span>
        </div>
      </div>
    </div>

    <!-- ========== 第二页 ========== -->
    <div class="page page-2" id="page2">
      <div class="page-content">
        <!-- 顶部两组单选条目 -->
        <div class="top-selectors">
          <div class="selector-pill">
            <div class="selector-avatar avatar-mint">
              <svg viewBox="0 0 40 40"><circle cx="20" cy="15" r="7" fill="#fff" opacity="0.9"/><ellipse cx="20" cy="32" rx="12" ry="8" fill="#fff" opacity="0.9"/></svg>
            </div>
            <span class="selector-label">推荐关注</span>
          </div>
          <div class="selector-pill active">
            <div class="selector-avatar avatar-peach">
              <svg viewBox="0 0 40 40"><circle cx="20" cy="15" r="7" fill="#fff" opacity="0.9"/><ellipse cx="20" cy="32" rx="12" ry="8" fill="#fff" opacity="0.9"/></svg>
            </div>
            <span class="selector-label">旅行日记</span>
          </div>
        </div>

        <!-- 4×2 应用图标网格 -->
        <div class="app-grid">
          <div class="app-item">
            <div class="app-icon icon-dot-coral">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">笔记</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-teal">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">健身</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-apricot">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">阅读</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-periwinkle">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">闹钟</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-blush">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">提醒</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-aqua">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">设置</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-butter">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">邮件</span>
          </div>
          <div class="app-item">
            <div class="app-icon icon-dot-mauve">
              <div class="dot-pattern"></div>
            </div>
            <span class="app-label">浏览器</span>
          </div>
        </div>

        <!-- PhotoBook 相册小组件 -->
        <div class="photobook-card">
          <div class="photobook-header">
            <div class="photobook-title">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8a9a" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="8" cy="16" r="1.5" fill="#8a8a9a"/></svg>
              <span>PhotoBook</span>
            </div>
            <div class="photobook-actions">
              <span class="photobook-date">7月25日</span>
              <button class="heart-btn" id="heartBtn2">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="none" stroke="#d0a0b0" stroke-width="1.5"/></svg>
              </button>
            </div>
          </div>
          <div class="photobook-preview">
            <div class="preview-img img-4"></div>
            <div class="preview-img img-5"></div>
            <div class="preview-img img-6"></div>
          </div>
        </div>

        <!-- 搜索框 -->
        <div class="search-bar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b0b0b8" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <span class="search-placeholder">搜索</span>
        </div>
      </div>

      <!-- 底部 Dock 栏 -->
      <div class="dock-bar">
        <div class="dock-item">
          <div class="dock-icon dock-icon-home"></div>
          <span>主页</span>
        </div>
        <div class="dock-item active">
          <div class="dock-icon dock-icon-discover"></div>
          <span>发现</span>
        </div>
        <div class="dock-item">
          <div class="dock-icon dock-icon-post"></div>
          <span>发布</span>
        </div>
        <div class="dock-item">
          <div class="dock-icon dock-icon-profile"></div>
          <span>我的</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 页面指示器 -->
  <div class="page-indicator" id="pageIndicator">
    <span class="dot active" data-page="0"></span>
    <span class="dot" data-page="1"></span>
  </div>

  <script src="script.js"></script>
</body>
</html>
