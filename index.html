<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Korean Ins Style UI</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="script.js"></script>
</head>
<body class="sparkle-bg m-0 p-0 w-full h-screen overflow-hidden">
<!-- BEGIN: Mobile Container -->
<main class="w-full h-full relative overflow-hidden bg-cover bg-center" style="background-color: rgb(255, 255, 255);">
  <!-- Semi-transparent overlay to soften the background image and match the vibe -->

  <div class="relative h-full flex flex-col pt-12 pb-6 px-5 gap-6 z-10 overflow-y-auto no-scrollbar">
    <!-- BEGIN: Music Widget -->
    <section class="glass rounded-4xl p-4 flex flex-col gap-4 shadow-sm">
      <!-- Header / Track Info -->
      <div class="flex items-center gap-4">
        <!-- Album Art Placeholder -->
        <div class="w-20 h-20 rounded-2xl bg-white/60 overflow-hidden shadow-inner flex-shrink-0">
          <img alt="Album Art" class="w-full h-full object-cover opacity-80 mix-blend-multiply" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCWsQ5iOnBDixu8a8_mWHq4RysRlKfHwU9tSKhlxQSOyZTXhe9rpZ0pRQf170zs0rB1MmH1IviVnilFxm0_JK1HtIE3d27xkgG1YvzlzyrScrt_-vtZiubYPA36Vh9fNTG8G8G4y9DcHbnvWzAfKs0apMs7FQphP4PsYoxT5sduDQRjOWU6kKEq7Gc-Zlssw84OipNH6RA0eW3gk3AQkyOVO7ErOKP7lB36yoMOxX2FWwTzQLunLKMd9Myr9zZ_YvN0Y1l9xEqYwhIR">
        </div>
        <!-- Track Details -->
        <div class="flex-1 flex flex-col justify-center">
          <div class="text-center font-serif text-lg text-theme-icon tracking-wide mb-2">CosmicLove</div>
          <div class="w-full h-1 bg-white/50 rounded-full overflow-hidden">
            <div class="w-1/3 h-full bg-theme-accent rounded-full"></div>
          </div>
          <div class="flex justify-between mt-1 text-[10px] text-theme-accent uppercase tracking-widest">
            <span class="">Shining</span>
            <span class="">Finne</span>
          </div>
        </div>
      </div>
      <!-- Controls -->
      <div class="flex justify-between items-center px-4 text-theme-icon">
        <!-- Prev -->
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path></svg>
        <!-- Play -->
        <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
        <!-- Next -->
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"></path></svg>
        <!-- Menu/Playlist -->
        <svg class="w-5 h-5 fill-current opacity-70 ml-2" viewBox="0 0 24 24"><path d="M3 15h14v-2H3v2zm0 4h14v-2H3v2zm0-8h14V9H3v2zm0-6v2h14V5H3zm16 0v14h2V5h-2z"></path></svg>
        <!-- Repeat -->
        <svg class="w-5 h-5 fill-current opacity-70" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"></path></svg>
      </div>
    </section>
    <!-- END: Music Widget -->

    <!-- BEGIN: Middle Section (Icons & Polaroids) -->
    <section class="flex gap-4 relative h-48">
      <!-- Left: Grid of App Icons -->
      <div class="w-1/2 grid grid-cols-2 gap-3 place-content-start pt-2">
        <!-- App 1 -->
        <div class="flex flex-col items-center gap-1">
          <div class="w-14 h-14 glass-strong rounded-2xl flex items-center justify-center">
            <svg class="w-6 h-6 text-theme-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect height="12" rx="2" width="16" x="4" y="6"></rect><path d="M9 12h.01M15 12h.01"></path></svg>
          </div>
          <span class="text-xs text-theme-text font-medium">Chat</span>
        </div>
        <!-- App 2 -->
        <div class="flex flex-col items-center gap-1">
          <div class="w-14 h-14 glass-strong rounded-2xl flex items-center justify-center">
            <svg class="w-6 h-6 text-theme-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect height="18" rx="2" ry="2" width="18" x="3" y="4"></rect><line x1="16" x2="16" y1="2" y2="6"></line><line x1="8" x2="8" y1="2" y2="6"></line><line x1="3" x2="21" y1="10" y2="10"></line></svg>
          </div>
          <span class="text-xs text-theme-text font-medium">Date</span>
        </div>
        <!-- App 3 -->
        <div class="flex flex-col items-center gap-1">
          <div class="w-14 h-14 glass-strong rounded-2xl flex items-center justify-center">
            <svg class="w-6 h-6 text-theme-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          </div>
          <span class="text-xs text-theme-text font-medium">Forum</span>
        </div>
        <!-- App 4 -->
        <div class="flex flex-col items-center gap-1">
          <div class="w-14 h-14 glass-strong rounded-2xl flex items-center justify-center">
            <svg class="w-6 h-6 text-theme-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          </div>
          <span class="text-xs text-theme-text font-medium">Group</span>
        </div>
      </div>
      <!-- Right: Stacked Polaroids -->
      <div class="w-1/2 relative h-full">
        <!-- Back Polaroid -->
        <div class="absolute top-12 right-0 w-28 h-32 bg-white p-2 pb-6 rounded-sm polaroid-shadow rotate-[15deg] z-0">
          <div class="w-full h-full bg-slate-100 overflow-hidden relative">
            <img alt="Photo 2" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDvDfGkcquljAQ6wB8llusJ0OIp8MfG_I8OnrptznffYlkhtZrxeQO84Mjra0ZU-kH9MxztP2XfxQ_RWoLJ4C60TWaqj10euXNNEi2J1Gr2QyXLF3MRUL2YInLfXBrSK9bn29OaGWIjwFtZWxdItsW7o6C7O6lDA3xPKo3pFlUDf32k3or4VMkar1LQfxFONa5I8Vkaw6QvE87Q3U1LHp1s2ieCofiI0__RDgohNG9I1PJVtRn9L0bBiU2IU8PucOjcKbydW01OypDi">
          </div>
        </div>
        <!-- Front Polaroid -->
        <div class="absolute top-0 right-4 w-32 h-36 bg-white p-2 pb-8 rounded-sm polaroid-shadow -rotate-6 z-10">
          <div class="w-full h-full bg-slate-100 overflow-hidden relative">
            <img alt="Photo 1" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBx0KiwzCdGUwVTmZcO31S-vNgOhYiH-Dbw8mCUXOtTXNI8cVuj8QP5UDJFjtG3sIRrXSx2Vq4LrQo1mTfAQu-HbrNe0--1IU_cmwWFTuDtVjwFUoVhH-ijhmWb4ds-IVLkXKO-lCXdEDP40f9FO0AePdIyQN8yXbkGcqKLFckTDnDNsbmiOzyaKO7z95M6xjSmGKXYYc73QZaluVcs0QrDbWpF25xv-aOheN0ug2UwGloboSg86FjUt3uBuFlkpmktcwu5R38twvfk">
          </div>
        </div>
      </div>
    </section>
    <!-- END: Middle Section -->

    <!-- BEGIN: Lower Section (Memo & Utilities) -->
    <section class="flex gap-4">
      <!-- Large Memo Card -->
      <div class="w-3/5 glass-strong rounded-3xl p-4 flex flex-col justify-between shadow-sm">
        <!-- Header -->
        <div class="flex items-center gap-2 mb-4">
          <img alt="Avatar" class="w-8 h-8 rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCGttBTc_tUBYFFhmaDpMbXWWNTcDAtPeVJhLg2A24pTvTkfnwRLS5vMjSHDeOGxKRxcO-98UxpxX29uXO_P-kJLDbvWxVcTWlUiL6-WxL5D1s231JTz-3p3NL9Dd1qsj526Qvhvf1n5NtbgN8p6fbydE-0bvxYvBlzVtYUE1dWCeVnWrg-k64B-2eA5Gcjl8PcAdPfcDtIV4ffFCseV6f0KPaAq0iYNA9wUE928_DS70XRH1n9c1QjMSmhmpNC8pzQcXV6I_156YS4">
          <div class="flex-1">
            <div class="text-sm font-semibold text-theme-icon leading-tight">Daily Note</div>
            <div class="text-[10px] text-theme-accent">@user</div>
          </div>
          <div class="text-[10px] text-theme-accent text-right">
            Apr 8<br>Wed 2026
          </div>
        </div>
        <!-- Body Text Placeholder -->
        <div class="flex-1">
          <p class="text-sm text-theme-text leading-relaxed font-serif">
            Perhaps we should<br>
            cling to our passionate freedom.
          </p>
        </div>
        <!-- Footer -->
        <div class="flex items-center gap-1 mt-4 text-theme-accent text-xs">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
          19:27
        </div>
      </div>
      <!-- 2x2 Utility Grid -->
      <div class="w-2/5 grid grid-cols-2 gap-3">
        <!-- Utility 1 -->
        <div class="flex flex-col items-center gap-1">
          <div class="w-12 h-12 glass rounded-2xl flex items-center justify-center shadow-sm">
            <svg class="w-5 h-5 text-theme-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          </div>
          <span class="text-[10px] text-theme-text font-medium">Health</span>
        </div>
        <!-- Utility 2 -->
        <div class="flex flex-col items-center gap-1">
          <div class="w-12 h-12 glass rounded-2xl flex items-center justify-center shadow-sm">
            <svg class="w-6 h-6 text-theme-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path></svg>
          </div>
          <span class="text-[10px] text-theme-text font-medium">Record</span>
        </div>
        <!-- Utility 3 -->
        <div class="flex flex-col items-center gap-1">
          <div class="w-12 h-12 glass rounded-2xl flex items-center justify-center shadow-sm">
            <svg class="w-5 h-5 text-theme-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" x2="16.65" y1="21" y2="16.65"></line></svg>
          </div>
          <span class="text-[10px] text-theme-text font-medium">Search</span>
        </div>
        <!-- Utility 4 -->
        <div class="flex flex-col items-center gap-1">
          <div class="w-12 h-12 glass rounded-2xl flex items-center justify-center shadow-sm">
            <svg class="w-6 h-6 text-theme-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          </div>
          <span class="text-[10px] text-theme-text font-medium">Finance</span>
        </div>
      </div>
    </section>
    <!-- END: Lower Section -->

    <!-- Spacer to push dock to bottom -->
    <div class="flex-1"></div>

    <!-- BEGIN: Bottom Dock -->
    <nav class="glass rounded-full px-6 py-4 flex justify-between items-center mt-4 shadow-sm">
      <!-- Dock Item 1 -->
      <div class="flex flex-col items-center">
        <div class="w-12 h-12 bg-white/70 rounded-2xl flex items-center justify-center shadow-sm">
          <svg class="w-6 h-6 text-theme-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" x2="22" y1="12" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        </div>
        <span class="text-[10px] text-theme-text mt-1">World</span>
      </div>
      <!-- Dock Item 2 -->
      <div class="flex flex-col items-center">
        <div class="w-12 h-12 bg-white/70 rounded-2xl flex items-center justify-center shadow-sm">
          <svg class="w-6 h-6 text-theme-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect height="18" rx="2" ry="2" width="18" x="3" y="3"></rect><line x1="3" x2="21" y1="9" y2="9"></line><line x1="9" x2="9" y1="21" y2="9"></line></svg>
        </div>
        <span class="text-[10px] text-theme-text mt-1">Terminal</span>
      </div>
      <!-- Dock Item 3 -->
      <div class="flex flex-col items-center">
        <div class="w-12 h-12 bg-white/70 rounded-2xl flex items-center justify-center shadow-sm">
          <svg class="w-6 h-6 text-theme-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>
        </div>
        <span class="text-[10px] text-theme-text mt-1">Theme</span>
      </div>
      <!-- Dock Item 4 -->
      <div class="flex flex-col items-center">
        <div class="w-12 h-12 bg-white/70 rounded-2xl flex items-center justify-center shadow-sm">
          <svg class="w-6 h-6 text-theme-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </div>
        <span class="text-[10px] text-theme-text mt-1">Settings</span>
      </div>
    </nav>
    <!-- END: Bottom Dock -->
  </div>
</main>
<!-- END: Mobile Container -->
</body>
</html>
